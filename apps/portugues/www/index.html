<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c"><title>Português</title>
<style>
:root{--bg:#0c0c0c;--card:#181818;--line:#2a2a2a;--fg:#f4f1ea;--mut:#9a958c;--acc:#f2c14e;--grn:#3fb37f;--red:#e05a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);min-height:100vh;display:flex;flex-direction:column;gap:12px}
h1{font:600 34px Georgia,serif;margin:12px 0 4px}h1 span{display:block;font-size:18px;color:var(--acc);font-style:italic;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:20px}.stats small,.big small{display:block;color:var(--mut);font-size:12px;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
.big{width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:600}
.big.primary{background:var(--acc);color:#111;border-color:var(--acc)}.big.primary small{color:#3d3420}
.big.ghost{background:transparent}.big.red{color:var(--red)}.big.green{color:var(--grn)}
.big.red.primary{background:var(--red);color:#fff;border-color:var(--red)}
.hint{color:var(--mut);font-size:14px;text-align:center}
.topbar{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.topbar button{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:18px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:16px 0}
.phase{color:var(--acc);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.en{font-size:24px;color:var(--mut)}.pt{font:600 34px Georgia,serif;min-height:1.2em}
.heard{color:var(--mut);font-size:16px;min-height:1.4em}.heard b{color:var(--fg)}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad-btn{padding:26px 8px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700}
.pad-btn.red{color:var(--red)}.pad-btn.green{color:var(--grn)}
.play{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-size:18px}
.opts{display:grid;gap:10px}
.opt{padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:18px;text-align:left}
.opt.right{border-color:var(--grn);background:#173326}.opt.wrong{border-color:var(--red);background:#3a1a17}
.row{display:flex;gap:8px}.row .big{padding:16px 6px;font-size:16px}
input#ans{width:100%;padding:16px;font-size:22px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-align:center}
.list h3{color:var(--acc);font:italic 18px Georgia,serif;margin:20px 0 6px}
.item{padding:12px 4px;border-bottom:1px solid var(--line)}.item span{display:block;font-size:18px}.item small{color:var(--mut)}
.form{display:flex;flex-direction:column;gap:18px}
.form label{display:flex;flex-direction:column;gap:8px;color:var(--mut);font-size:14px}.form label.check{flex-direction:row;align-items:center}
.form output{color:var(--fg)}
select{padding:14px;border-radius:12px;background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:16px}
input[type=range]{accent-color:var(--acc)}
</style></head>
<body><div id="app"></div><script src="bundle.js"></script></body></html>
