<style>
:root{--bg:#111110;--fg:#ece9e2;--mute:#8d8a82;--line:#2a2927;--mark:#d4452c}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px "Helvetica Neue",Helvetica,Arial,sans-serif}
body{padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
h1{font-size:15px;font-weight:500;margin:0}
.count{color:var(--mute);font-variant-numeric:tabular-nums} .count b{color:var(--mark)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{background:#1d1c1a;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:3/4;background:#1b1a18;border:0;padding:0;cursor:pointer;overflow:hidden;border-radius:2px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:6px;top:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(17,17,16,.72);padding:2px 6px;border-radius:2px}
.x{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:48px;font-weight:200;color:#fff;background:rgba(212,69,44,.35);border:3px solid var(--mark);box-sizing:border-box}
.tile[data-marked="1"] img{filter:grayscale(1);opacity:.4} .tile[data-marked="1"] .x{display:flex}
.tile[hidden]{display:none}
.out{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
textarea{width:100%;box-sizing:border-box;height:120px;background:#1b1a18;color:var(--fg);border:1px solid var(--line);font:12px Menlo,monospace;padding:8px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:4px;padding:8px 14px;font-size:13px;cursor:pointer;margin-right:8px}
.btn.alt{background:#1d1c1a;color:var(--fg);border:1px solid var(--line)}
p{color:var(--mute);font-size:12px;max-width:70ch}
</style></head><body>
