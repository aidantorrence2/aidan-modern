<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibe moodboard picker</title>
<style>
:root{color-scheme:light}
body{margin:0;background:#f4f1ec;color:#111;font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#f4f1ec;border-bottom:1px solid #ddd;padding:12px 16px}
h1{font:400 26px/1 Georgia,serif;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid #bbb;background:#fff;border-radius:3px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
.tabs button[aria-selected=true]{background:#111;color:#fff;border-color:#111}
.tabs small{opacity:.6;margin-left:4px}
.board{display:flex;gap:6px;margin-top:10px;align-items:center;min-height:84px}
.board .slot{width:62px;height:78px;border:1px dashed #aaa;border-radius:3px;background:#fff center/cover no-repeat;position:relative}
.board .slot b{position:absolute;left:3px;top:2px;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row button{border:1px solid #111;background:#111;color:#fff;border-radius:3px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
.row button.ghost{background:#fff;color:#111}
.row label{font-size:13px}
main{padding:12px 16px 120px}
h2{font:400 20px Georgia,serif;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:3/4;border-radius:3px;overflow:hidden;cursor:pointer;background:#ddd}
.tile img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tile .n{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:#111;font:700 12px/20px system-ui;text-align:center}
.tile.on{outline:3px solid #111;outline-offset:2px}
.tile.on .n{background:#fff}
.tile .t{position:absolute;left:6px;bottom:5px;color:#fff;font-size:11px;text-shadow:0 0 4px #000}
textarea{width:100%;height:110px;margin-top:8px;font:12px ui-monospace,monospace;border:1px solid #bbb;border-radius:3px;padding:8px;box-sizing:border-box}
#msg{font-size:12px;color:#555}
</style>
<header>
  <h1>Pick 4 photos per vibe</h1>
  <div class="tabs" id="tabs"></div>
  <div class="board" id="board"></div>
  <div class="row">
    <label><input type="checkbox" id="all"> show every bucket</label>
    <label><input type="checkbox" id="men" checked> include men</label>
    <button id="copy">Copy picks</button>
    <button class="ghost" id="reset">Reset to current</button>
    <span id="msg"></span>
  </div>
  <textarea id="out" readonly></textarea>
</header>
<main id="main"></main>

function save(){try{localStorage.setItem('vibe-picks',JSON.stringify(picks))}catch{}}
function render(){
  $('tabs').innerHTML='';
  for(const [k,l] of VIBES){const b=document.createElement('button');b.setAttribute('aria-selected',k===vibe);b.innerHTML=l+'<small>'+picks[k].length+'/4</small>';b.onclick=()=>{vibe=k;render();scrollTo(0,0)};$('tabs').appendChild(b)}
  $('board').innerHTML='';
  for(let i=0;i<4;i++){const s=document.createElement('div');s.className='slot';const id=picks[vibe][i];if(id){s.style.backgroundImage='url('+src(id)+')';s.innerHTML='<b>'+(i+1)+'</b>';s.title='click to remove';s.style.cursor='pointer';s.onclick=()=>{picks[vibe].splice(i,1);save();render()}}$('board').appendChild(s)}
  const showAll=$('all').checked, men=$('men').checked;
  const groups=showAll?[...new Set(ITEMS.map(x=>x.theme))]:GROUP[vibe];
  $('main').innerHTML='';
  for(const g of groups){
    const list=ITEMS.filter(x=>x.theme===g&&(men||!x.man)); if(!list.length) continue;
    const h=document.createElement('h2');h.textContent=g+' ('+list.length+')';$('main').appendChild(h);
    const grid=document.createElement('div');grid.className='grid';
    for(const x of list){
      const idx=picks[vibe].indexOf(x.id);
      const t=document.createElement('div');t.className='tile'+(idx>=0?' on':'');

      grid.appendChild(t)}
    $('main').appendChild(grid)}
  $('out').value=VIBES.map(([k,l])=>l+': '+picks[k].join(', ')).join('\n');
}
$('all').onchange=render;$('men').onchange=render;
$('reset').onclick=()=>{picks=JSON.parse(JSON.stringify(CURRENT));save();render()};

render();
