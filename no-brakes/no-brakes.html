<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>No Brakes</title>
<!--
  NO BRAKES — starring Dario. A companion/answer to the viral Opus 5.5 "Western civilization"
  film that ends on ACCELERATE: same plate-engraving language (gold line work on black and aged
  paper, Latin chapter marks, a ticking timeline, a running index), told from the other side.
  Every frame is drawn by draw(t); render.mjs captures it. Open directly to preview (click = restart,
  ?t=40 to start at 40s).
-->
<style>
@font-face { font-family: Cormorant; font-weight: 500; src: url(fonts/cormorant-garamond-latin-500-normal.woff2); }
@font-face { font-family: Cormorant; font-weight: 600; src: url(fonts/cormorant-garamond-latin-600-normal.woff2); }
@font-face { font-family: Cormorant; font-weight: 500; font-style: italic; src: url(fonts/cormorant-garamond-latin-500-italic.woff2); }
@font-face { font-family: Oswald; font-weight: 400; src: url(fonts/oswald-latin-400-normal.woff2); }
@font-face { font-family: Oswald; font-weight: 600; src: url(fonts/oswald-latin-600-normal.woff2); }
@font-face { font-family: Plex; font-weight: 400; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2); }
@font-face { font-family: Plex; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
body:not(.capture) canvas { width: 96vw; height: auto; margin: 2vh auto; max-height: 96vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), main = cv.getContext('2d');
// everything is drawn to an offscreen buffer first so the chromatic split can be applied after
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
let g = buf.getContext('2d');

// 96 BPM: one bar = 2.5s. Chapters land on bar lines so the score can hit them.
const C = {
  open: 0, gub: 7.5, fren: 17.5, mod: 27.5, mach: 37.5, aur: 47.5, cert: 60, hic: 70, climax: 77.5, fin: 82.5, end: 90,
};
const TOTAL = C.end;
window.CH = C; window.TOTAL = TOTAL; window.BPM = 96;

// ---------- palette ----------
const BLACK = '#0a0907', GOLD = '#dcb664', GOLD_HI = '#f3dc9c', PAPER = '#e7dabd', INK = '#2a1c0d', RED = '#c23a2c';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIn = (x) => x * x * x;
const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
function keys(t, K) { // piecewise-linear keyframes [[t, v], ...] with eased segments
  if (t <= K[0][0]) return K[0][1];
  for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) return lerp(K[i][1], K[i + 1][1], eIO(prog(t, K[i][0], K[i + 1][0])));
  return K[K.length - 1][1];
}
function lin(t, K) { // same, but straight lines between keys
  if (t <= K[0][0]) return K[0][1];
  for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) return lerp(K[i][1], K[i + 1][1], prog(t, K[i][0], K[i + 1][0]));
  return K[K.length - 1][1];
}

// ---------- polylines with draw-on ----------
const circ = (cx, cy, r, a0 = 0, a1 = TAU, n = 72) => { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + ((a1 - a0) * i) / n; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; };
const ell = (cx, cy, rx, ry, a0 = 0, a1 = TAU, n = 72) => { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + ((a1 - a0) * i) / n; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; };
const seg = (x1, y1, x2, y2) => [[x1, y1], [x2, y2]];
const rectP = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
const bez = (a, b, c, d, n = 28) => { const p = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; p.push([u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]]); } return p; };
const xf = (pts, dx, dy, s = 1) => pts.map(([x, y]) => [dx + x * s, dy + y * s]);
function addPartial(pts, k) {
  if (k <= 0 || pts.length < 2) return;
  if (k >= 1) { g.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) g.lineTo(...pts[i]); return; }
  let L = 0; const d = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); d.push(l); L += l; }
  let left = L * k; g.moveTo(...pts[0]);
  for (let i = 1; i < pts.length; i++) {
    if (left >= d[i - 1]) { g.lineTo(...pts[i]); left -= d[i - 1]; }
    else { const f = left / d[i - 1]; g.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
  }
}
// draw a set of polylines, revealed one after another as k goes 0 → 1
function drawSet(polys, k = 1, spread = 0.6) {
  g.beginPath();
  const n = polys.length;
  polys.forEach((p, i) => addPartial(p, spread >= 1 ? k : clamp((k - (spread * i) / n) / (1 - spread))));
  g.stroke();
}
function pen(col, w = 2, glow = 0) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.shadowColor = glow ? 'rgba(235,190,100,.55)' : 'transparent'; g.shadowBlur = glow;
}
function noGlow() { g.shadowColor = 'transparent'; g.shadowBlur = 0; }

// ---------- type ----------
function txt(s, x, y, o = {}) {
  const { font = 'Oswald', w = 600, size = 40, color = GOLD, align = 'left', ls = 0, alpha = 1, base = 'alphabetic', style = 'normal', glow = 0 } = o;
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${style} ${w} ${size}px ${font}`; g.letterSpacing = ls + 'px';
  g.textAlign = align; g.textBaseline = base; g.fillStyle = color;
  if (glow) { g.shadowColor = 'rgba(235,190,100,.45)'; g.shadowBlur = glow; }
  g.fillText(s, x, y); g.restore();
}
// kinetic caption: words rise in one by one, all lift out together at t1
function kin(t, t0, t1, lines, x, y, o = {}) {
  if (t < t0 || t > t1) return;
  const { size = 92, color = '#f1e4c2', lh = 1.05, align = 'left', accent = {}, glow = 14, stagger = 0.07 } = o;
  const out = prog(t, t1 - 0.3, t1);
  g.save(); g.font = `600 ${size}px Oswald`; g.letterSpacing = '2px'; g.textBaseline = 'alphabetic';
  let wi = 0;
  lines.forEach((line, li) => {
    const words = line.split(' ');
    const widths = words.map((w) => g.measureText(w + ' ').width);
    const total = widths.reduce((a, b) => a + b, 0) - g.measureText(' ').width;
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    const ly = y + li * size * lh;
    words.forEach((w, i) => {
      const k = eOut(prog(t, t0 + wi * stagger, t0 + wi * stagger + 0.35));
      g.save();
      g.beginPath(); g.rect(cx - 10, ly - size * 1.05, widths[i] + 20, size * 1.3); g.clip();
      g.globalAlpha = k * (1 - out);
      g.fillStyle = accent[w] || color;
      if (glow && !o.paper) { g.shadowColor = 'rgba(235,190,100,.35)'; g.shadowBlur = glow; }
      g.fillText(w, cx, ly + (1 - k) * size * 0.9 - out * 40);
      g.restore();
      cx += widths[i]; wi++;
    });
  });
  g.restore();
}

// ---------- backgrounds ----------
const paperTex = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  const id = x.getImageData(0, 0, W, H); let s = 99;
  for (let i = 0; i < W * H; i++) {
    s = (s * 1103515245 + 12345) & 0x7fffffff; const n = ((s >> 9) & 255) / 255 - 0.5;
    id.data[i * 4] += n * 18; id.data[i * 4 + 1] += n * 16; id.data[i * 4 + 2] += n * 14;
  }
  x.putImageData(id, 0, 0);
  for (let i = 0; i < 26; i++) { // stains
    const gx = hash(i * 3.7) * W, gy = hash(i * 5.3) * H, r = 60 + hash(i * 1.1) * 260;
    const gr = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    gr.addColorStop(0, 'rgba(140,100,40,0.07)'); gr.addColorStop(0.8, 'rgba(140,100,40,0.03)'); gr.addColorStop(1, 'rgba(140,100,40,0)');
    x.fillStyle = gr; x.fillRect(gx - r, gy - r, 2 * r, 2 * r);
  }
  x.strokeStyle = 'rgba(120,90,50,.06)'; x.lineWidth = 1;
  for (let i = 0; i < 400; i++) { const fx = hash(i * 9.1) * W, fy = hash(i * 2.3) * H, a = hash(i) * TAU, l = 8 + hash(i * 4.4) * 30; x.beginPath(); x.moveTo(fx, fy); x.lineTo(fx + Math.cos(a) * l, fy + Math.sin(a) * l); x.stroke(); }
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(90,60,20,0)'); v.addColorStop(1, 'rgba(90,60,20,.45)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c;
})();
const grains = [0, 1, 2, 3].map((k) => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), id = x.createImageData(256, 256);
  let s = 777 + k * 31;
  for (let i = 0; i < 65536; i++) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0); return c;
});
function bgBlack() {
  g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H / 2, W * 0.7);
  v.addColorStop(0, 'rgba(60,45,20,.22)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function bgPaper() { g.drawImage(paperTex, 0, 0); }

// plate furniture: double border, corner ticks, chapter mark, plate number
function plate(t, t0, num, name, sub, paper = false) {
  const a = eOut(prog(t, t0, t0 + 0.6)), col = paper ? 'rgba(42,28,13,.75)' : 'rgba(220,182,100,.55)';
  g.save(); g.globalAlpha = a; pen(col, 1.5);
  g.strokeRect(34, 34, W - 68, H - 68); pen(col, 0.8); g.strokeRect(44, 44, W - 88, H - 88);
  pen(col, 1.5);
  for (const [x, y] of [[34, 34], [W - 34, 34], [34, H - 34], [W - 34, H - 34]]) { g.beginPath(); g.moveTo(x - 14, y); g.lineTo(x + 14, y); g.moveTo(x, y - 14); g.lineTo(x, y + 14); g.stroke(); }
  g.restore();
  const c = paper ? INK : GOLD;
  txt(num, 86, 112, { font: 'Cormorant', w: 600, size: 34, color: c, alpha: a, ls: 4 });
  txt(name, 86 + (num.length * 22) + 26, 112, { font: 'Cormorant', w: 600, size: 34, color: c, alpha: a, ls: 12 });
  txt(sub, 88, 146, { font: 'Plex', w: 400, size: 15, color: c, alpha: a * 0.75, ls: 4 });
  g.save(); g.globalAlpha = a; pen(c, 1); g.beginPath(); g.moveTo(86, 126); g.lineTo(86 + 520 * eOut(prog(t, t0 + 0.2, t0 + 1.2)), 126); g.stroke(); g.restore();
  txt('PL. ' + num, W - 86, 112, { font: 'Cormorant', w: 600, size: 26, color: c, alpha: a * 0.8, ls: 6, align: 'right' });
}
function figLabel(s, x, y, a, paper = false, align = 'left') { txt(s, x, y, { font: 'Cormorant', w: 500, style: 'italic', size: 28, color: paper ? INK : GOLD, alpha: a, align }); }
function callout(t, t0, x1, y1, x2, y2, label, paper = false, align = 'left') {
  const k = eOut(prog(t, t0, t0 + 0.6)); if (k <= 0) return;
  const col = paper ? INK : GOLD;
  g.save(); pen(col, 1.3); g.globalAlpha = 0.9;
  g.beginPath(); g.arc(x1, y1, 4, 0, TAU); g.fillStyle = col; g.fill();
  g.beginPath(); addPartial([[x1, y1], [x2, y2], [x2 + (align === 'left' ? 1 : -1) * 40, y2]], k); g.stroke(); g.restore();
  txt(label, x2 + (align === 'left' ? 52 : -52), y2 + 6, { font: 'Plex', w: 500, size: 17, color: col, alpha: prog(t, t0 + 0.35, t0 + 0.8), ls: 2, align });
}

// ---------- HUD: timeline + capability / control index ----------
const YEARS = [[0, 1788], [C.fren - 0.6, 1788], [C.fren + 0.4, 1869], [C.mod - 0.6, 1869], [C.mod + 0.4, 1942], [C.mach, 1942], [C.mach + 0.6, 2017], [C.mach + 7.5, 2026], [C.hic + 2, 2026], [C.climax, 2028], [C.fin, 2031]];
const CAP = [[0, 0.03], [C.gub, 0.05], [C.fren, 0.12], [C.mod, 0.24], [C.mach, 0.3], [C.mach + 7.5, 0.83], [C.cert, 0.9], [C.hic, 0.97], [C.climax, 1.35], [C.fin, 2.2]];
const CTL = [[0, 0.03], [C.gub, 0.05], [C.fren, 0.12], [C.mod, 0.25], [C.mach, 0.29], [C.mach + 7.5, 0.33], [C.hic, 0.34], [C.fin, 0.34]];
window.YEAR_TICKS = [];
const yx = (y) => lin(y, [[1750, 160], [1900, 760], [2000, 1360], [2032, 1760]]);
function hud(t, paper = false) {
  const col = paper ? INK : GOLD, dim = paper ? 'rgba(42,28,13,.45)' : 'rgba(220,182,100,.38)';
  const a = eOut(prog(t, C.gub, C.gub + 0.8)) * (1 - prog(t, C.fin - 0.05, C.fin));
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  const y0 = 1000;
  pen(dim, 1); g.beginPath(); g.moveTo(160, y0); g.lineTo(1760, y0); g.stroke();
  for (let yr = 1750; yr <= 2030; yr += (yr < 2000 ? 25 : 5)) {
    const x = yx(yr), major = yr % 50 === 0;
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y0 - (major ? 12 : 6)); g.stroke();
    if (major) txt(String(yr), x, y0 + 22, { font: 'Plex', w: 400, size: 13, color: dim, align: 'center' });
  }
  const yr = keys(t, YEARS), x = yx(yr);
  pen(col, 2); g.beginPath(); g.moveTo(160, y0); g.lineTo(x, y0); g.stroke();
  g.fillStyle = RED; g.beginPath(); g.moveTo(x, y0 - 4); g.lineTo(x - 8, y0 - 18); g.lineTo(x + 8, y0 - 18); g.fill();
  const shown = t > C.climax + 1 ? (Math.floor(t * 12) % 2 ? '20??' : String(Math.floor(yr))) : String(Math.floor(yr));
  txt(shown, x, y0 - 28, { font: 'Plex', w: 500, size: 20, color: col, align: 'center', ls: 2 });
  txt('ANNO', 160, y0 - 28, { font: 'Plex', w: 400, size: 13, color: dim, ls: 4 });
  // index readout (bottom-right corner block)
  const cap = keys(t, CAP), ctl = keys(t, CTL), bx = 1500, by = 940, bw = 260;
  const rows = [['CAPABILITY', cap, col], ['CONTROL', ctl, dim]];
  rows.forEach(([lab, v, c], i) => {
    const yy = by - 54 + i * 26;
    txt(lab, bx - 14, yy + 5, { font: 'Plex', w: 400, size: 13, color: dim, ls: 3, align: 'right' });
    pen(dim, 1); g.strokeRect(bx, yy - 6, bw, 10);
    g.fillStyle = c; g.fillRect(bx, yy - 6, bw * Math.min(v, 1), 10);
    if (v > 1) { g.fillStyle = RED; if (Math.floor(t * 8) % 2) g.fillRect(bx + bw + 4, yy - 6, 10, 10); }
    txt(v > 1 ? '>1.00' : v.toFixed(2), bx + bw + 22, yy + 5, { font: 'Plex', w: 500, size: 15, color: v > 1 ? RED : c, ls: 1 });
  });
  const gap = cap - ctl;
  if (gap > 0.04) {
    g.fillStyle = 'rgba(194,58,44,.55)'; g.fillRect(bx + bw * ctl, by - 28 + 6, bw * (Math.min(cap, 1) - ctl), 3);
    txt('GAP ' + (gap > 1 ? '—' : gap.toFixed(2)), bx + bw + 22, by - 2, { font: 'Plex', w: 500, size: 13, color: RED, ls: 3 });
  }
  g.restore();
}

// ---------- FIG: Watt's centrifugal governor ----------
function governor(cx, cy, s, phi, spread, k, o = {}) {
  const { col = GOLD, glow = 10, snap = 0, tAll = 0 } = o;
  const L = 230, top = -230, th = lerp(0.55, 1.05, spread);
  const polys = [];
  polys.push(seg(0, -330, 0, 270)); // spindle
  polys.push(rectP(-16, top - 22, 32, 28)); // top collar
  polys.push(ell(0, 270, 120, 26), ell(0, 300, 120, 26), seg(-120, 270, -120, 300), seg(120, 270, 120, 300)); // bevel gear
  for (let i = 0; i < 24; i++) { const a = (i / 24) * TAU + phi; if (Math.sin(a) > 0) polys.push(seg(Math.cos(a) * 120, 270 + Math.sin(a) * 26, Math.cos(a) * 120, 300 + Math.sin(a) * 26)); }
  polys.push(bez([-260, 330], [-260, 150], [-140, -60], [-30, -320]), bez([260, 330], [260, 150], [140, -60], [30, -320])); // frame arch
  polys.push(seg(-300, 330, 300, 330));
  const balls = [];
  const collarY = top + L * Math.cos(th) * 0.9 + 60;
  polys.push(rectP(-22, collarY - 14, 44, 28));
  for (const off of [0, Math.PI]) {
    const p = phi + off, sx = Math.sin(th) * Math.cos(p), z = Math.sin(th) * Math.sin(p);
    let bx = L * sx, by = top + L * Math.cos(th);
    // when it snaps, the balls fly off
    if (snap > 0) { bx += Math.sign(sx || 1) * snap * 1400; by -= snap * 300 - snap * snap * 900; }
    polys.push(seg(0, top, bx, by));
    polys.push(seg(bx * 0.5, top + (by - top) * 0.5, 0, collarY));
    const r = 46 * (1 + z * 0.12);
    balls.push([bx, by, r, z]);
  }
  // throttle lever + butterfly valve
  polys.push(seg(0, collarY, 190, collarY - 20), seg(190, collarY - 20, 330, collarY + 80));
  polys.push(circ(340, 230, 54), seg(340 + Math.cos(spread * 1.4) * 54, 230 + Math.sin(spread * 1.4) * 54, 340 - Math.cos(spread * 1.4) * 54, 230 - Math.sin(spread * 1.4) * 54));
  polys.push(seg(286, 230, 220, 230), seg(394, 230, 460, 230));
  g.save(); g.translate(cx, cy); g.scale(s, s);
  pen(col, 2.2 / s, glow);
  drawSet(polys, k);
  balls.sort((a, b) => a[3] - b[3]).forEach(([bx, by, r], i) => {
    const kb = clamp(k * 1.6 - 0.6);
    if (kb <= 0) return;
    g.fillStyle = col === GOLD ? BLACK : PAPER;
    g.beginPath(); g.arc(bx, by, r, 0, TAU); g.fill();
    pen(col, 2.2 / s, glow); g.beginPath(); addPartial(circ(bx, by, r), kb); g.stroke();
    // engraved hatching on the shadow side
    g.save(); g.beginPath(); g.arc(bx, by, r, 0, TAU); g.clip(); noGlow(); pen(col, 1 / s);
    g.beginPath();
    for (let j = -r; j < r; j += 7) { g.moveTo(bx + j, by + r); g.lineTo(bx + j + r, by - r * 0.1 + j * 0.2); }
    g.globalAlpha = 0.5 * kb; g.stroke(); g.restore();
  });
  g.restore();
}

// ---------- scenes ----------
function sOpen(t) {
  bgBlack();
  const k = eIO(prog(t, 0.2, 4.2));
  governor(960, 470, 0.95, t * 2.2, 0.35 + 0.05 * Math.sin(t * 2), k);
  const ta = eOut(prog(t, 4.4, 5.6));
  g.save(); g.globalAlpha = ta; g.fillStyle = 'rgba(10,9,7,.7)'; g.fillRect(0, 760, W, 220); g.restore();
  txt('NO BRAKES', 960 + 15, 880, { font: 'Cormorant', w: 600, size: 150, color: GOLD_HI, align: 'center', ls: 30, alpha: ta, glow: 30 });
  txt('starring Dario', 960, 950, { font: 'Cormorant', w: 500, style: 'italic', size: 44, color: GOLD, align: 'center', alpha: eOut(prog(t, 5.4, 6.3)) });
  txt('FIG. I', 960, 108, { font: 'Plex', w: 400, size: 15, color: GOLD, align: 'center', ls: 6, alpha: 0.6 * eOut(prog(t, 1, 2)) });
}
function sGub(t) {
  bgBlack(); plate(t, C.gub, 'I', 'GVBERNATOR', 'BIRMINGHAM · 1788');
  // speed rises, the balls fly out, the valve closes, the speed settles: feedback
  const sp = keys(t, [[C.gub, 0.25], [C.gub + 3.5, 0.95], [C.gub + 6, 0.55], [C.gub + 10, 0.6]]);
  governor(560, 500, 1.02, t * (2 + sp * 4), sp, 1, {});

    const p = pos(u0), px = cx + p[0] * R2, py = cy + p[1] * R2;
    g.fillStyle = `rgba(243,220,156,${ka * (p[2] >= 0 ? 1 : 0.4)})`; g.beginPath(); g.arc(px, py, 7, 0, TAU); g.fill();
    txt(lab, px + 14, py - 10, { font: 'Plex', w: 500, size: 14, color: GOLD_HI, ls: 2, alpha: ka * (p[2] >= 0 ? 1 : 0.35) });
  });
  figLabel('Fig. VIII — The race, as seen from orbit.', cx, 950, eOut(prog(t, C.cert + 0.8, C.cert + 1.6)), false, 'center');
  kin(t, C.cert + 0.5, C.cert + 3.3, ['EASE OFF'], 1200, 470, { size: 92 });
  kin(t, C.cert + 3.4, C.cert + 6.8, ['AND SOMEONE', 'LESS CAREFUL', 'WINS.'], 1200, 400, { size: 86 });
  kin(t, C.cert + 6.9, C.hic - 0.1, ['SO NOBODY', 'EASES OFF.'], 1200, 430, { size: 92, accent: { 'NOBODY': RED } });
}
// ---------- the edge of the map ----------
function sHic(t) {
  bgPaper(); plate(t, C.hic, 'VII', 'HIC SVNT DRACONES', 'TERRA INCOGNITA · 2027 →', true);
  const k = eIO(prog(t, C.hic + 0.1, C.hic + 1.8));
  // coastline
  const coast = [];
  for (let i = 0; i <= 120; i++) { const y = 175 + (i / 120) * 845; coast.push([420 + noise(i * 0.07) * 110 + noise(i * 0.22 + 9) * 22 + Math.sin(i * 0.05) * 50, y]); }
  pen(INK, 2.2); drawSet([coast], k, 0);
  g.save(); pen('rgba(42,28,13,.35)', 1); g.beginPath();
  for (let r = 1; r < 5; r++) coast.forEach((p, i) => (i ? g.lineTo(p[0] + r * 14, p[1]) : g.moveTo(p[0] + r * 14, p[1])));
  g.globalAlpha = k; g.stroke();
  g.beginPath(); for (let y = 180; y < 1010; y += 14) { const cxl = lin(y, coast.map((p) => [p[1], p[0]])); g.moveTo(80, y); g.lineTo(cxl - 6, y + 10); } g.globalAlpha = 0.5 * k; g.stroke(); g.restore();
  // compass rose + rhumb lines
  const rx = 760, ry = 650, rr = 120;
  pen('rgba(42,28,13,.25)', 1); const rh = []; for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; rh.push(seg(rx, ry, rx + Math.cos(a) * 1400, ry + Math.sin(a) * 1400)); } drawSet(rh, k, 0.5);
  pen(INK, 1.8); const star = [];
  for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU - Math.PI / 2, l = i % 2 ? rr * 0.55 : rr; star.push([[rx + Math.cos(a - 0.18) * 22, ry + Math.sin(a - 0.18) * 22], [rx + Math.cos(a) * l, ry + Math.sin(a) * l], [rx + Math.cos(a + 0.18) * 22, ry + Math.sin(a + 0.18) * 22]]); }
  drawSet([circ(rx, ry, rr * 0.75), circ(rx, ry, rr * 0.8), ...star], k, 0.5);
  txt('N', rx, ry - rr - 12, { font: 'Cormorant', w: 600, size: 30, color: INK, align: 'center', alpha: k });
  // the edge of the chart: neat line ends, blank beyond
  const ex = 1240;
  pen(INK, 2); drawSet([seg(ex, 60, ex, 1020)], k, 0);
  g.save(); g.globalAlpha = 0.9 * k; g.fillStyle = 'rgba(231,218,189,.55)'; g.fillRect(ex, 50, W - ex - 50, 980); g.restore();
  txt('hic sunt dracones', 1560, 430, { font: 'Cormorant', w: 500, style: 'italic', size: 48, color: INK, align: 'center', alpha: eOut(prog(t, C.hic + 1.4, C.hic + 2.4)) });
  // sea serpent
  const ser = [];
  for (let i = 0; i <= 80; i++) { const x = 1330 + i * 6, y = 600 - Math.max(0, Math.sin(i * 0.2 + t * 2)) * 55; ser.push([x, y]); }
  pen(INK, 2.4); drawSet([ser, circ(1820, 560, 26, Math.PI * 0.9, Math.PI * 2.1, 20), bez([1806, 572], [1790, 600], [1800, 620], [1810, 640])], eIO(prog(t, C.hic + 1.8, C.hic + 3.4)), 0.4);
  // the red route, running off the map at speed
  const prr = keys(t, [[C.hic + 0.6, 0], [C.hic + 3.5, 0.55], [C.climax, 1]]);
  const route = bez([150, 900], [700, 860], [900, 260], [1300, 520], 60).concat(bez([1300, 520], [1500, 690], [1700, 720], [1980, 640], 60).slice(1));
  pen(RED, 5); g.beginPath(); addPartial(route, prr); g.stroke();
  callout(t, C.hic + 3.6, ex, 290, 1060, 210, 'END OF KNOWN TERRITORY', true, 'right');
  kin(t, C.hic + 0.5, C.hic + 4.4, ['PAST THE EDGE', 'OF THE MAP'], 140, 250, { color: INK, paper: true, size: 84 });
  kin(t, C.hic + 4.5, C.climax - 0.05, ['AT FULL SPEED.'], 140, 250, { color: RED, paper: true, size: 92 });
}
function sClimax(t) {
  bgBlack();
  const lt = t - C.climax, snap = eIn(prog(t, C.climax + 3.0, C.fin));
  const sp = clamp(0.6 + lt * 0.2);
  const shake = 4 + lt * 6;
  g.save(); g.translate(noise(t * 33) * shake, noise(t * 41) * shake);
  governor(960, 500, 1.12 + lt * 0.06, 2.3 + lt * lt * 9 + lt * 6, sp, 1, { snap });
  g.restore();
  txt('Fig. I, again.', 960, 1010, { font: 'Cormorant', w: 500, style: 'italic', size: 28, color: GOLD, align: 'center', alpha: 1 - prog(t, C.climax + 2, C.climax + 3) });
  g.fillStyle = `rgba(255,240,210,${eIn(prog(t, C.fin - 0.35, C.fin))})`; g.fillRect(0, 0, W, H);
}
function sFin(t) {
  g.fillStyle = '#060504'; g.fillRect(0, 0, W, H);
  const strike = eOut(prog(t, C.fin + 1.5, C.fin + 1.9));
  const accA = t < C.fin + 0.4 ? 0 : lerp(1, 0.28, prog(t, C.fin + 2.2, C.fin + 3.0));
  txt('ACCELERATE', 960, 470, { font: 'Oswald', w: 600, size: 150, color: '#f1e4c2', align: 'center', ls: 26, alpha: accA, base: 'middle' });
  if (strike > 0) { g.fillStyle = RED; g.fillRect(420, 466, 1080 * strike, 10); }
  const na = eOut(prog(t, C.fin + 2.4, C.fin + 3.4));
  txt('NO BRAKES', 960 + 15, 690, { font: 'Cormorant', w: 600, size: 130, color: GOLD_HI, align: 'center', ls: 28, alpha: na, glow: 26 });
  txt('starring Dario', 960, 760, { font: 'Cormorant', w: 500, style: 'italic', size: 40, color: GOLD, align: 'center', alpha: eOut(prog(t, C.fin + 3.3, C.fin + 4.0)) });
  const da = eOut(prog(t, C.fin + 4.0, C.fin + 4.8));
  txt('PARODY & COMMENTARY · AN ILLUSTRATED, FICTIONAL DEPICTION OF A PUBLIC FIGURE · NOT AFFILIATED WITH OR ENDORSED BY ANTHROPIC', 960, 1000, { font: 'Plex', w: 400, size: 13, color: 'rgba(220,182,100,.55)', align: 'center', ls: 2, alpha: da });
}
window.SNAP_AT = C.climax + 3.0; window.STRIKE_AT = C.fin + 1.5;

// ---------- chromatic split + grain, then present ----------
const tint = document.createElement('canvas'); tint.width = W; tint.height = H; const tg = tint.getContext('2d');
function present(t, ca) {
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'source-over'; main.globalAlpha = 1;
  if (ca < 0.3) { main.drawImage(buf, 0, 0); }
  else {
    main.fillStyle = '#000'; main.fillRect(0, 0, W, H);
    for (const [col, dx] of [['#ff0000', -ca], ['#00ff00', 0], ['#0000ff', ca]]) {
      tg.globalCompositeOperation = 'source-over'; tg.drawImage(buf, 0, 0);
      tg.globalCompositeOperation = 'multiply'; tg.fillStyle = col; tg.fillRect(0, 0, W, H);
      main.globalCompositeOperation = 'lighter'; main.drawImage(tint, dx, dx * 0.3);
    }
    main.globalCompositeOperation = 'source-over';
  }
  const fr = Math.floor(t * 24);
  main.save(); main.globalAlpha = 0.07; main.globalCompositeOperation = 'overlay';
  main.translate(-((hash(fr) * 256) | 0), -((hash(fr + 7) * 256) | 0));
  main.fillStyle = main.createPattern(grains[fr % 4], 'repeat'); main.fillRect(0, 0, W + 256, H + 256); main.restore();
}

const SCENES = [[C.open, sOpen], [C.gub, sGub], [C.fren, sFren], [C.mod, sMod], [C.mach, sMach], [C.aur, sAur], [C.cert, sCert], [C.hic, sHic], [C.climax, sClimax], [C.fin, sFin]];
const PAPER_SCENES = new Set([sFren, sHic]);
function sceneAt(t) { let s = SCENES[0]; for (const e of SCENES) if (t >= e[0]) s = e; return s; }
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; noGlow();
  const [t0, fn] = sceneAt(t);
  fn(t);
  if (fn !== sOpen && fn !== sClimax && fn !== sFin) hud(t, PAPER_SCENES.has(fn));
  // wipe from the previous plate: a gold scan line sweeps left → right over 0.45s
  const idx = SCENES.findIndex((e) => e[1] === fn), wipe = prog(t, t0, t0 + 0.45);
  if (idx > 0 && wipe < 1 && fn !== sFin && fn !== sClimax) {
    const wx = eIO(wipe) * W, prev = SCENES[idx - 1][1];
    g.save(); g.beginPath(); g.rect(wx, 0, W - wx, H); g.clip(); prev(t0 - 0.001); if (prev !== sOpen && prev !== sClimax) hud(t0 - 0.001, PAPER_SCENES.has(prev)); g.restore();
    g.fillStyle = GOLD_HI; g.shadowColor = 'rgba(255,220,140,.9)'; g.shadowBlur = 30; g.fillRect(wx - 2, 0, 4, H); noGlow();
  }
  const ca = keys(t, [[0, 0], [C.hic + 3, 0], [C.climax, 5], [C.fin - 0.5, 22], [C.fin, 0]]);
  present(t, ca);
}
window.draw = draw;

if (new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');
else {
  const seek = parseFloat(new URLSearchParams(location.search).get('t') || '0');
  let t0 = performance.now();
  cv.addEventListener('click', () => { t0 = performance.now(); });
  document.fonts.ready.then(() => { const loop = () => { draw((seek + (performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); });
}
</script>
