function camera(){Z=Math.max(.75,Math.min(2.2,VW/(VW<700?330:640)));$('#world').style.transform=`translate(${VW/2-cam.x*Z}px,${VH*(VW<700?.36:.44)-cam.y*Z}px) scale(${Z})`;$('#me').style.left=me.x+'px';$('#me').style.top=me.y+'px'}
function loop(){if(!free){cam.x+=(me.x-cam.x)*.09;cam.y+=(me.y-cam.y)*.09}camera();requestAnimationFrame(loop)}

/* imagery: a photograph is always on screen */
const LV=STOPS.map((s,i)=>s.f.length?i:-1).filter(i=>i>=0);
$('#th').innerHTML=LV.map(i=>`<i data-i="${i}" style="left:${STOPS[i].x}px;top:${STOPS[i].y}px"></i>`).join('');
function thumbs(){document.querySelectorAll('#th i').forEach(e=>{const i=+e.dataset.i;if(Math.abs(i-st.cur)<=12&&!e.style.backgroundImage)e.style.backgroundImage=`url(${src(STOPS[i].f[0])})`;e.classList.toggle('on',i<=st.cur);e.classList.toggle('here',i===st.cur&&!busy)})}
function gBg(i){const s=STOPS[i];if(s.f.length||!(s.p.length||s.g.length))return;const id=s.p.length?s.p[0].g:s.g[0][0],u=gsrc(id),im=new Image();im.onload=()=>{if(st.cur!==i)return;const a=$(bgN?'#bgB':'#bgA'),b=$(bgN?'#bgA':'#bgB');bgCur='g'+id;a.style.transition='none';a.classList.remove('on');a.style.zIndex=1;b.style.zIndex=0;a.style.backgroundImage=`url(${u})`;void a.offsetWidth;a.style.transition='';a.classList.add('on');bgN^=1;setTimeout(()=>{if(bgCur==='g'+id)b.classList.remove('on')},1500)};im.src=u}
function bgFor(i){if(STOPS[i].f.length)return STOPS[i].f[Math.max(0,Math.min(STOPS[i].f.length-1,i===st.cur?st.ph:0))];for(let j=i-1;j>=0;j--)if(STOPS[j].f.length)return STOPS[j].f[STOPS[j].f.length-1];return STOPS[LV[0]].f[0]}
let bgN=0,bgCur=-1;function setBg(i){const f=bgFor(i);if(f.i===bgCur)return;bgCur=f.i;const im=new Image();im.onload=()=>{if(bgCur!==f.i)return;const a=$(bgN?'#bgB':'#bgA'),b=$(bgN?'#bgA':'#bgB');a.style.transition='none';a.classList.remove('on');a.style.zIndex=1;b.style.zIndex=0;a.style.backgroundImage=`url(${src(f)})`;void a.offsetWidth;a.style.transition='';a.classList.add('on');bgN^=1;setTimeout(()=>{if(bgCur===f.i)b.classList.remove('on')},1500)};im.src=src(f)}
const PER=()=>VW<700?4:6,total=s=>s.fp.length+Math.ceil(s.g.length/PER()),WARM={};
const pre=u=>{if(!WARM[u]){WARM[u]=1;new Image().src=u}};
const warmPh=(s,ph)=>{if(!s||ph<0||ph>=total(s))return;const nf=s.fp.length;if(ph<nf)return pre(src(s.fp[ph]));const P=PER(),pg=ph-nf;s.g.slice(pg*P,pg*P+P).forEach(x=>pre(gsrc(x[0])))};
const warm=i=>{const s=STOPS[i];if(s){warmPh(s,0);if(!s.f.length)warmPh(s,s.p.length?0:s.fp.length)}};
const story=i=>STOPS[i].np||STOPS[i].t;      // places where the journey pauses
function setCard(h,m,t,anim,d){const w=$('#where');w.querySelector('.d').textContent=d||'';w.querySelector('h2').textContent=h;w.querySelector('.m').textContent=m;w.querySelector('.t').textContent=t||'';if(anim){w.classList.remove('sw');void w.offsetWidth;w.classList.add('sw')}}
function odo(){$('#odo').textContent=`${fmt(Math.round(st.km/10)*10)} km · stop ${st.cur+1} of ${STOPS.length}`}
function card(anim=true){const s=STOPS[st.cur];if(st.intro)setCard('The road',`${STOPS.length} stops · ${fmt(Math.round(TOTALKM/100)*100)} km · Dunedin to Rio de Janeiro`,`${NPH} photographs so far. It starts at the bottom of the world.`,anim);
  else setCard(s.n,[s.c,s.np?s.np+(s.np===1?' photograph':' photographs'):''].filter(Boolean).join(' · '),s.t,anim,`${s.w} · Entry ${st.cur+1} of ${STOPS.length}`);
  document.body.classList.toggle('arr',!!s.f.length&&!busy);
  setBg(st.cur);gBg(st.cur);warm(st.cur);odo();$('#restart').hidden=st.intro||(!st.cur&&st.ph<0);$('#hint').classList.toggle('off',st.taps>3&&st.cur<STOPS.length-1);
  $('#hint').textContent=st.cur===STOPS.length-1&&!st.intro&&st.ph<0?'That is the road so far. Tap to start again →':'Tap anywhere →'}
function travel(to){if(busy||to===st.cur)return;busy=true;free=false;document.body.classList.remove('arr');warm(to);if(STOPS[to].f.length)setBg(to);const dir=to>st.cur?1:-1,legs=Math.abs(to-st.cur);
  (function leg(){const a=STOPS[st.cur],b=STOPS[st.cur+dir],d=dir>0?b.d:a.d,T=RM?1:dir<0?260:Math.max(legs>4?320:480,Math.min(legs>4?900:2000,d/3)),t0=performance.now(),k0=st.km;
    (function tick(t){const k=Math.min(1,(t-t0)/T),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;me.x=a.x+(b.x-a.x)*e;me.y=a.y+(b.y-a.y)*e;if(dir>0)st.km=k0+d*e;drawOvLite();
      if(k<1)return requestAnimationFrame(tick);st.cur+=dir;if(dir<0)st.km=Math.max(0,k0-d);
      if(st.cur!==to){const p=STOPS[st.cur];setCard(p.n,p.c,'',false,p.w);return leg()}
      busy=false;st.ph=-1;drawOv();card();save()})(t0)})()}
let lite=0;function drawOvLite(){if(++lite%3)return;drawOv();odo()}
/* photographs: one at a time, each assembling from four pieces */
function shot(){let fit=null;const s=STOPS[st.cur],S=$('#shot'),fr=$('#frame'),nf=s.fp.length,T=total(s),aw=VW-(VW<700?16:120),ah=VH-126;
  $('#bars').innerHTML=Array.from({length:T},(_,i)=>`<i class="${i<=st.ph?'on':''}"></i>`).join('');$('#sCity').textContent=s.n;
  if(st.ph<nf){const f=s.fp[st.ph],k=Math.min(aw/f.w,ah/f.h);fr.className='';fr.style.width=f.w*k+'px';fr.style.height=f.h*k+'px';
    fr.innerHTML=[0,1,2,3].map(q=>`<i style="--k:${q};left:${q%2*49.8}%;top:${(q>>1)*49.8}%;background-image:url(${src(f)});background-position:${q%2*100}% ${(q>>1)*100}%;transform:translate(${rnd(-90,90)}px,${rnd(-70,70)}px) rotate(${rnd(-16,16)}deg) scale(.9)"></i>`).join('');
    $('#sLed').textContent=[s.w,f.roll&&'roll '+f.roll,f.fr&&'frame '+f.fr,f.stock].filter(Boolean).join(' · ');warmPh(s,st.ph+1)}
  else{const P=PER(),pg=st.ph-nf,it=s.g.slice(pg*P,pg*P+P),cols=VW<700?2:3,rows=Math.ceil(it.length/cols),th=Math.floor(Math.min((ah-8*(rows-1))/rows,(aw-8*(cols-1))/cols/.69)*.96);
    fr.className='wall';fr.style.width=aw+'px';fr.style.height='';
    fr.innerHTML=it.map((x,k)=>`<b style="--k:${k};background-image:url(${gsrc(x[0])});height:${th}px;width:${Math.min(aw,th*x[1]/x[2])}px;transform:translate(${rnd(-110,110)}px,${rnd(-80,80)}px) rotate(${rnd(-14,14)}deg) scale(.9)"></b>`).join('');
    fit=()=>{for(let t=th,n=0;fr.offsetHeight>ah&&n<10;n++){t*=.9;fr.querySelectorAll('b').forEach((e,k)=>{const x=it[k];e.style.height=t+'px';e.style.width=Math.min(aw,t*x[1]/x[2])+'px'})}};
    warmPh(s,st.ph+1);
    $('#sLed').textContent=`${s.w} · contact sheet`}
  $('#sN').textContent=`${st.ph+1} / ${T}`;document.body.classList.add('shot');S.classList.add('on');if(fit)fit();requestAnimationFrame(()=>requestAnimationFrame(()=>{S.classList.add('lit');fr.classList.add('in')}));save()}
function closeShot(){setBg(st.cur);const S=$('#shot');document.body.classList.remove('shot');S.classList.remove('lit');setTimeout(()=>S.classList.remove('on'),RM?0:350)}
/* one action moves everything forward */
let opened=false,lastAct=0;function next(){const now=performance.now();if(!opened||busy||now-lastAct<220)return;lastAct=now;st.taps++;
  if(st.intro){st.intro=false;card();save();return}
  const s=STOPS[st.cur];if(st.ph<total(s)-1){st.ph++;return shot()}
  if(st.ph>=0)closeShot();
  if(st.cur===STOPS.length-1){if(st.ph<0)return restart();st.ph=-1;card();save();return}
  let j=st.cur+1;while(j<STOPS.length-1&&!story(j))j++;st.ph=-1;travel(j)}
function prev(){const now=performance.now();if(!opened||busy||now-lastAct<220||st.intro)return;lastAct=now;
  if(st.ph>0){st.ph--;return shot()}if(st.ph===0){st.ph=-1;closeShot();card();save();return}
  if(!st.cur)return;let j=st.cur-1;while(j>0&&!story(j))j--;travel(j)}
function restart(){st={cur:0,km:0,ph:-1,intro:false,taps:st.taps};closeShot();me={x:STOPS[0].x,y:STOPS[0].y};free=false;drawOv();card();save()}
$('#restart').onclick=e=>{e.stopPropagation();restart()};
/* every kind of input does the same thing */
let dragged=false,down=null;
addEventListener('pointerdown',e=>{if(!opened||e.target.closest('button'))return;down={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,map:!$('#shot').classList.contains('on'),node:e.target.closest('.node')};dragged=false});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>10){dragged=true;if(down.map&&e.pointerType==='mouse'&&!busy){free=true;cam.x=down.cx-dx/Z;cam.y=down.cy-dy/Z}}});
addEventListener('pointerup',e=>{if(!down)return;const d=down,dx=e.clientX-d.x,dy=e.clientY-d.y;down=null;
  if(dragged){if(e.pointerType==='mouse'&&d.map)return;if(Math.abs(dx)>Math.abs(dy)?dx<-40:dy<-40)return next();if(Math.abs(dx)>Math.abs(dy)?dx>40:dy>40)return prev();return}
  (e.clientX<VW*.22?prev:next)()});
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','Backspace','PageUp'].includes(e.key)){e.preventDefault();prev()}});
let wheel=0,wt=0;addEventListener('wheel',e=>{const now=performance.now();if(now-wt<650)return;wheel+=e.deltaY+e.deltaX;if(Math.abs(wheel)>50){wt=now;(wheel>0?next:prev)();wheel=0}},{passive:true});
addEventListener('resize',()=>{VW=innerWidth;VH=innerHeight;if(st.ph>=0)shot()});
me={x:STOPS[st.cur].x,y:STOPS[st.cur].y};cam={...me};drawOv();camera();loop();card();
/* opening: photographs first, one obvious thing to press */
const HERO=LV.map(i=>STOPS[i].f[0]),ALLF=STOPS.flatMap(s=>s.f);let hi=0,hn=0,hT=null;
function hero(){const f=HERO[hi++%HERO.length],im=new Image();im.onload=()=>{const a=$(hn?'#slB':'#slA'),b=$(hn?'#slA':'#slB');a.style.backgroundImage=`url(${src(f)})`;a.classList.remove('on');void a.offsetWidth;a.classList.add('on');b.classList.remove('on');hn^=1};im.src=src(f)}
hero();hT=setInterval(hero,2600);
const BURST=[];for(let k=0;k<16;k++){const f=ALLF[Math.floor(k*ALLF.length/16)];const im=new Image();im.src=src(f);BURST.push([f,im])}
function bang(){if(opened)return;opened=true;clearInterval(hT);const fl=$('#flash'),ready=BURST.filter(b=>b[1].complete&&b[1].naturalWidth);let k=0;$('#play').style.display='none';
  if(RM||!ready.length){$('#open').classList.add('off');lastAct=performance.now();return}
  fl.style.display='block';const iv=setInterval(()=>{if(k>=ready.length){clearInterval(iv);$('#open').classList.add('off');lastAct=performance.now();if(st.ph>=0)shot();return}fl.style.backgroundImage=`url(${src(ready[k++][0])})`},95)}
$('#open').addEventListener('click',bang);addEventListener('keydown',e=>{if(!opened&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){e.preventDefault();e.stopImmediatePropagation();bang()}},true);
</script></body></html>
